# CI —— 让"提交前该跑的那两条命令"在远端也有执法点。
#
# 为什么值得有它（STATUS §6 记过这条缺口）：仓库的主张是"公开 API 只增不改"，
# 而执法点是 PublicApiTests / VersionTests 这两条用例；在那之前，它们只在有人
# **手动**跑 tools/build.ps1 -Strict 时才生效——也就是说，拦住改动的不是守卫，
# 而是纪律。守卫要真的说话，就得有人在每个提交上跑它。
#
# 为什么是 windows + Windows PowerShell（powershell，不是 pwsh）：
#   tools/*.ps1 是按 Windows PowerShell 5.1 写的（UTF-8 BOM、-Encoding UTF8、
#   conhost 的坑），宿主这一层也只在这套环境里被真实使用过。用 runner 自带的
#   powershell 跑，保证"CI 跑的就是开发者本机跑的那条路径"，
#   而不是再引入一套解释器差异去解释。
#
# 那为什么还有一个 ubuntu 作业（2026-10-05 加，登记册 W7）：
#   `engine/core` 平台中立（全仓库只有两处平台相关代码）这条主张，此前**只由那句话本身**
#   支撑，没有任何远端作业在守着它。Linux 作业就是那个守卫——它跑同一份引擎验收，
#   但**换一套操作系统**。它跑在 pwsh（PowerShell 7）上：PS 5.1 那套写法是 Windows 侧
#   的历史包袱，Linux 上只有 pwsh 可用；两边跑的**是同一份 build.ps1**，差别只在解释器与 OS。
#   `-SkipWebSmoke` 是刻意的：前端那一层已经有自己的作业，而它的判据与操作系统无关。
#
# 五个作业：
#   build-and-test  引擎侧：tools/build.ps1 -Strict（0 警告 + 599 用例 + 主/Web 两条 sln + 前端冒烟）
#                   （这个数在 1.9.0 时是 531；S13 的 5 条守卫 → 536；2026-10-04 把
#                     save-transfer-1.10.0 / tools-s1-s13 / click-power-bridge 三条分支合并后
#                     实测 **556**，同一天做完存档导出/导入的两个窗口（W13/W14）之后是 **564**。
#                     它会继续长——"当前几个"的权威来源永远是 build.ps1 打印的那一行，
#                     见 engine/docs/OPEN_WORK.md 的 W1，以及守着这 11 处槽位的
#                     engine/tests/TestCountDriftTests.cs）
#   engine-linux    同一份引擎验收，跑在 ubuntu 上（守"平台中立"这条主张）
#   web-smoke       前端侧：node tools/web-smoke.mjs（无头 DOM 桩件把 wwwroot/app.js 真跑一遍）
#   end-to-end      Web 宿主侧：tools/api-test.ps1（起真宿主，打全部端点）
# 分开跑的理由是失败时的信号不同：第一条红了说明引擎或公开 API 有问题，
# 第二条红了说明**页面**那一层有问题（它不需要 .NET，也不需要宿主），
# 第三条红了说明"宿主 + 浏览器协议"那一段有问题——这三类故障的排查方向完全不一样。
# （engine-linux 与 build-and-test 是**同一条命令、两个 OS**：它红了先看是不是平台相关代码。）
#
# 前端冒烟为什么单独一个作业、而且这里**必须显式装 node**：
#   build-and-test 里的 build.ps1 也会跑它（gate 在场内），但那条路径在 CI 上依赖
#   runner 自带的 node。这里单独跑一遍，是把"前端这一层的红"独立成一条明确的信号，
#   也是把工具链版本钉住（build.ps1 那边只要求"有 node"）。

name: CI

on:
  push:
    branches: [main]
    # release 作业由 tag 触发（形状 v*），本作业之外的三/四个作业则由 push/PR 触发。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建（0 警告）+ 全部用例
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库的目标框架是 net8.0。setup-dotnet 会把 8.0.x 的 SDK 与共享运行时一起装上
      # （后者是端到端那一步起宿主必需的：宿主声明 Microsoft.AspNetCore.App 8.0）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: tools/build.ps1 -Strict
        shell: powershell
        run: .\tools\build.ps1 -Strict

  engine-linux:
    name: 引擎（Linux · 平台中立那条主张的守卫）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 与 build-and-test **同一条命令、同一个判据**，只差操作系统与解释器（pwsh）。
      # -SkipWebSmoke：前端那一层有自己的作业，且它与操作系统无关。
      # 它红了先问一个问题：是平台相关代码，还是这条命令在 Linux 上本来就跑不起来？
      #
      # 失败时把日志尾部打成**一条注解**（`::error::` + `%0A` 换行）：这个仓库的 job 日志
      # 在未登录时读不到（API 403），而注解是公开可读的——所以让失败自己说出来，
      # 而不是等人拿 token 去翻日志。注解本身就是这条作业的诊断输出。
      - name: tools/build.ps1 -Strict -SkipWebSmoke
        shell: pwsh
        run: |
          ./tools/build.ps1 -Strict -SkipWebSmoke 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content build.log -Tail 30) -join '%0A'
            Write-Host "::error title=Linux 作业失败了（尾部 30 行）::$tail"
          }
          exit $code

  web-smoke:
    name: 前端冒烟（wwwroot / app.js）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 这个作业不需要 .NET、不需要宿主、不需要网络——它把 app.js 真的 import 起来跑，
      # DOM 是桩件。钉住 node 版本是为了让"本地过、CI 红"这种差异只可能来自代码。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node tools/web-smoke.mjs
        shell: powershell
        run: node .\tools\web-smoke.mjs

  end-to-end:
    name: Web 宿主端到端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: tools/api-test.ps1
        shell: powershell
        run: .\tools\api-test.ps1

  # 发布：此前四个作业**没有一个跑 tools/pack.ps1，也没有一个上传任何东西**——产物只存在于
  # 开发者本机。这条作业补的就是那一步，顺序被 §4.1 的硬约束钉死，不能重排：
  #   pack.ps1 打 zip（内含产物自检：解开到临时目录、起真宿主、探针全绿）
  #     → **紧接着**算 zip 的 sha256（Compress-Archive 把修改时间写进归档，
  #       所以哈希只能打包后算，预先是写不死的；tools/pack.ps1:64）
  #     → tools/release.ps1 生成 feed.json + feed.json.sha256
  #     → 上传。顺序反了就会发出一份 hash 对不上的清单。
  #
  # 为什么 release.ps1 里还要再核对一次 tag 与 Directory.Build.props 的 <Version>：
  # 版本号只有一处事实来源（那个 props 文件），tag 只是发布动作的锚。两者不等就判死，
  # 否则会出现"包里是 1.12.1、清单说是 1.13.0"这种下游谁都拦不住的漂移。
  #
  # 为什么清单也当成发布资产传上去、而不是 commit 进仓库：
  # feed.json 里的 size/hash 只有在打完包之后才知道，而它每次重打都会变。让它跟着 release
  # 走，`releases/latest/download/feed.json` 就是一个稳定的清单地址，客户端也有东西可下
  # （neko-launcher/contracts/sources.json 的 github 源指的就是这个地址）。
  release:
    name: 发布（tag 触发的打包 + 清单 + 上传）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # 建立 release 与上传资产需要写权限；其余作业只需要读，所以权限只在这条作业里放开。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: tools/pack.ps1（含产物自检）
        shell: powershell
        run: .\tools\pack.ps1

      - name: tools/release.ps1 -Tag ${{ github.ref_name }}（算哈希 + 写清单）
        shell: powershell
        run: .\tools\release.ps1 -Tag ${{ github.ref_name }}

      # 上传前把清单打印一遍：job 日志在未登录时读不到（API 403），而发布数据是**公开可读**的
      # ——让这一版到底发了什么自己说出来（engine-linux 作业用 ::error:: 注解是同一个理由）。
      - name: 打印清单（发布数据本身就是诊断输出）
        shell: powershell
        run: Get-Content .\artifacts\feed.json -Raw

      - name: 上传 zip + 清单
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/neko-clicker-*-win-x64.zip
            artifacts/feed.json
            artifacts/feed.json.sha256
