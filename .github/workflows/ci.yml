# CI —— 让"提交前该跑的那两条命令"在远端也有执法点。
#
# 为什么值得有它（STATUS §6 记过这条缺口）：仓库的主张是"公开 API 只增不改"，
# 而执法点是 PublicApiTests / VersionTests 这两条用例；在那之前，它们只在有人
# **手动**跑 tools/build.ps1 -Strict 时才生效——也就是说，拦住改动的不是守卫，
# 而是纪律。守卫要真的说话，就得有人在每个提交上跑它。
#
# 为什么是 windows + Windows PowerShell（powershell，不是 pwsh）：
#   tools/*.ps1 是按 Windows PowerShell 5.1 写的（UTF-8 BOM、-Encoding UTF8、
#   conhost 的坑），宿主这一层也只在这套环境里被真实使用过。用 runner 自带的
#   powershell 跑，保证"CI 跑的就是开发者本机跑的那条路径"，
#   而不是再引入一套解释器差异去解释。
#
# 三个作业：
#   build-and-test  引擎侧：tools/build.ps1 -Strict（0 警告 + 536 用例 + 主/Web 两条 sln + 前端冒烟）
#                   （这个数在 1.9.0 时刷成 531；本轮 S13 加了 5 条守卫 → 536。
#                     它会继续长——"当前几个"的权威来源永远是 build.ps1 打印的那一行，
#                     见 engine/docs/OPEN_WORK.md 的 W1）
#   web-smoke       前端侧：node tools/web-smoke.mjs（无头 DOM 桩件把 wwwroot/app.js 真跑一遍）
#   end-to-end      Web 宿主侧：tools/api-test.ps1（起真宿主，打全部端点）
# 分开跑的理由是失败时的信号不同：第一条红了说明引擎或公开 API 有问题，
# 第二条红了说明**页面**那一层有问题（它不需要 .NET，也不需要宿主），
# 第三条红了说明"宿主 + 浏览器协议"那一段有问题——这三类故障的排查方向完全不一样。
#
# 前端冒烟为什么单独一个作业、而且这里**必须显式装 node**：
#   build-and-test 里的 build.ps1 也会跑它（gate 在场内），但那条路径在 CI 上依赖
#   runner 自带的 node。这里单独跑一遍，是把"前端这一层的红"独立成一条明确的信号，
#   也是把工具链版本钉住（build.ps1 那边只要求"有 node"）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建（0 警告）+ 全部用例
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库的目标框架是 net8.0。setup-dotnet 会把 8.0.x 的 SDK 与共享运行时一起装上
      # （后者是端到端那一步起宿主必需的：宿主声明 Microsoft.AspNetCore.App 8.0）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: tools/build.ps1 -Strict
        shell: powershell
        run: .\tools\build.ps1 -Strict

  web-smoke:
    name: 前端冒烟（wwwroot / app.js）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 这个作业不需要 .NET、不需要宿主、不需要网络——它把 app.js 真的 import 起来跑，
      # DOM 是桩件。钉住 node 版本是为了让"本地过、CI 红"这种差异只可能来自代码。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node tools/web-smoke.mjs
        shell: powershell
        run: node .\tools\web-smoke.mjs

  end-to-end:
    name: Web 宿主端到端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: tools/api-test.ps1
        shell: powershell
        run: .\tools\api-test.ps1
