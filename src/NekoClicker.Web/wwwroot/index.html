<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NekoClicker · Web 宿主骨架</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #14131a;
      --fg: #eceaf5;
      --dim: #8f8aa6;
      --card: #1e1c28;
      --accent: #ffb3c7;
      --ok: #7ee0a8;
      --bad: #ff8f8f;
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    }
    body { margin: 0; padding: 3rem 1.5rem; background: var(--bg); color: var(--fg); line-height: 1.7; }
    main { max-width: 46rem; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 .35rem; }
    .sub { color: var(--dim); margin-bottom: 2rem; }
    .card { background: var(--card); border-radius: .75rem; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
    .card h2 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0 0 .75rem; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: .35rem 1.25rem; margin: 0; }
    dt { color: var(--dim); }
    dd { margin: 0; font-family: ui-monospace, Consolas, monospace; }
    ul { margin: 0; padding-left: 1.2rem; font-family: ui-monospace, Consolas, monospace; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .note { color: var(--dim); font-size: .9rem; }
    code { background: #00000040; padding: .1rem .35rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <main>
    <h1>NekoClicker · Web 宿主骨架</h1>
    <p class="sub">这一版只证明「引擎 → 浏览器」这条线是通的，还没有游戏界面。</p>

    <div class="card">
      <h2>宿主自证 · /api/ping</h2>
      <dl id="ping"><dt>状态</dt><dd class="bad">请求中…</dd></dl>
    </div>

    <div class="card">
      <h2>运行时发现的内容包 · /api/packs</h2>
      <ul id="packs"><li>请求中…</li></ul>
      <p class="note">
        宿主不引用任何内容包，只扫描输出目录里的 <code>NekoClicker.Content.*.dll</code>。
        加一个新包不需要改这个项目。
      </p>
    </div>

    <p class="note">
      下一步要定的是：快照怎么推（轮询 / SSE）、引擎 tick 与推送频率的关系、以及存档槽位。
      在这两件事定下来之前不写界面——否则界面会替这两个决定做选择。
    </p>
  </main>

  <script type="module">
    const $ = (sel) => document.querySelector(sel);

    function row(dl, key, value, cls) {
      const dt = document.createElement("dt"); dt.textContent = key;
      const dd = document.createElement("dd"); dd.textContent = value;
      if (cls) dd.className = cls;
      dl.append(dt, dd);
    }

    try {
      const ping = await fetch("/api/ping").then((r) => r.json());
      const dl = $("#ping"); dl.textContent = "";
      row(dl, "状态", "在线", "ok");
      row(dl, "框架版本", ping.apiVersion);
      row(dl, "程序集版本", ping.assemblyVersion);
      row(dl, "运行时", ping.framework);
    } catch (err) {
      const dl = $("#ping"); dl.textContent = "";
      row(dl, "状态", "失败：" + err.message, "bad");
    }

    try {
      const packs = await fetch("/api/packs").then((r) => r.json());
      const ul = $("#packs"); ul.textContent = "";
      if (packs.length === 0) {
        ul.innerHTML = "<li class=\"note\">没有发现内容包（先跑一次构建）。</li>";
      } else {
        for (const p of packs) {
          const li = document.createElement("li");
          li.textContent = p.id;
          ul.append(li);
        }
      }
    } catch (err) {
      $("#packs").innerHTML = `<li class="bad">失败：${err.message}</li>`;
    }
  </script>
</body>
</html>
