<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NekoClicker</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- 金猫是浮层：它冒出来时页面别的地方不该重排 -->
  <div id="golden" class="golden-layer hidden"></div>
  <div id="toast" class="toast"></div>

  <!-- 离线收益：读档补发的那一笔（GameSnapshot.offline）。
       它是一次性**事件**而不是每秒都在的数值，所以做成压在画面之上的播报卡；
       "收下"会把宿主那份状态清掉，于是刷新页面不会再弹第二次。 -->
  <div id="offline" class="sheet-layer hidden">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="offline-title">
      <h2 id="offline-title">🌙 欢迎回来</h2>
      <p id="offline-text"></p>
      <p id="offline-note" class="muted"></p>
      <button id="offline-ok" class="sheet-ok">收下</button>
    </div>
  </div>

  <!-- 表态（待答选择 + 立场轴 + 结局）：它**不是页签，而是一张小窗口**，
       形态与上面那张离线收益完全共用（`.sheet-layer` / `.sheet` / `.sheet-ok` /
       `sheet-in`）——这里没有第二套弹窗。
       三条约定写在 app.js 的 renderChoicesSheet 里，这里只说界面：
       ① 有待答表态时它自己冒出来，玩家不必先去发现并点开哪个页签；
       ② 它可以被收起（"收起，稍后再答" / 右上角 × / 点遮罩 / Esc），收起后只剩
          下面那个药丸——表态**不会被丢掉**，药丸一直在，点它就回来；
       ③ 与离线收益那张不会同时出现：离线收益是读档补发的一次性事件，它先讲完。 -->
  <div id="choices-sheet" class="sheet-layer hidden">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="choices-title">
      <div class="sheet-head">
        <h2 id="choices-title">表态</h2>
        <span id="stance-summary" class="muted"></span>
        <button id="choices-close" class="sheet-close" type="button" aria-label="收起表态窗口">&times;</button>
      </div>
      <div id="choices" class="list"></div>
      <div id="stances" class="stances"></div>
      <button id="choices-later" class="sheet-ok">收起，稍后再答</button>
    </div>
  </div>

  <!-- 收起之后的表态：这是它唯一的入口，因此**只要还有待答就一直在**。
       它只写条数——"看到条数"不等于"看到了谁在问什么、有哪些选项"，而结局只会落定一次，
       所以给引擎的 choicesShown 只由上面那张真的画出选项的 sheet 发出（见 reportChoicesShown）。
       答完最后一条时它和 sheet 一起消失。 -->
  <button id="choices-pill" class="choices-pill hidden" type="button"></button>

  <header>
    <h1 id="title">载入中…</h1>
    <div class="status">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">连接中…</span>
      <a id="switch" href="./">换一个包</a>
    </div>
  </header>

  <main>
    <!-- 左栏：大数字 + 点击 + 纪元推进 -->
    <section class="hero">
      <div class="counter">
        <span id="cookies">0</span>
        <span id="currency-name" class="unit"></span>
      </div>
      <div class="rates">
        <span id="cps">0/s</span>
        <span id="per-click">每次 +0</span>
      </div>

      <button id="big-cat" class="big-cat" title="点它，或者按空格">
        <span id="click-icon">🐱</span>
        <span class="hint"><span id="click-action">点击</span><kbd>空格</kbd></span>
      </button>

      <div id="buffs" class="buffs hidden"></div>

      <!-- 纪元：只有一个主按钮（决策 R1），未完成时置灰并说明卡在哪 -->
      <div id="era" class="era hidden">
        <div class="era-head">
          <span id="era-name" class="era-name"></span>
          <span id="era-index" class="muted"></span>
        </div>
        <p id="era-theme" class="era-theme"></p>
        <!-- 层内阶段：服务端派生（`era.stageIndex` / `stageCount`），没声明阶段的包整行隐藏。
             它回答的是"这一层里我走到哪一段了"，与上面那条"这一层还差多少"是两个问题。 -->
        <p id="era-stage" class="era-stage hidden"></p>
        <div class="bar"><i id="era-bar"></i></div>
        <p id="era-reason" class="era-reason"></p>
        <button id="ascend" class="ascend">舍一命</button>
      </div>

      <div class="meta">
        <span>成就 <b id="achievements">0 / 0</b></span>
        <span class="meta-actions">
          <!-- 立场轴与结局的常驻入口。它**不是**一个需要玩家先去发现的页签：
               待答表态会自己弹出来（见下面的 #choices-sheet），这里只是"想再看一眼我偏向哪边、
               结局说了什么"时的入口——答完最后一条表态之后，那是唯一还能回到那张 sheet 的路。
               内容包没有立场也没有结局时整个按钮隐藏（见 app.js 的 renderStanceEntry）。 -->
          <button id="stances-open" class="ghost hidden" title="看立场轴与结局">立场</button>
          <button id="save" class="ghost">存档</button>
        </span>
      </div>
    </section>

    <!-- 右栏：面板切换 -->
    <section class="panels">
      <nav class="tabs" id="tabs">
        <button data-tab="buildings" class="active">建筑</button>
        <button data-tab="upgrades">升级</button>
        <!-- 永久线：内容包没有这条线时整个按钮会被隐藏（见 app.js 的 renderPermanent） -->
        <button data-tab="permanent" id="tab-permanent">永久 <b id="permanent-badge" class="badge hidden"></b></button>
        <button data-tab="codex">图鉴</button>
        <button data-tab="achievements">成就</button>
        <button data-tab="log">日志</button>
      </nav>

      <div class="panel" data-panel="buildings">
        <div class="panel-head">
          <h2>建筑</h2>
          <div id="batch" class="batch"></div>
        </div>
        <!-- 建筑行由 app.js 逐条生成：一行 = [📖 故事][⬆ 升级轨][买卡片]，两个框展开在下面。
             卡片本体仍然是"点一下买"，展开是**另外两个控件**——取舍与展开状态的存放
             都写在 app.js 的 renderBuildings 里（这里没有静态标记，因为每一行都要跟
             快照走：价格、可负担性、解锁进度每帧都在变）。
             ⬆ 只在这座建筑**真的有升级**时才出现（`buildings[].upgradeIds` 非空）。 -->
        <div id="buildings" class="list"></div>
      </div>

      <div class="panel hidden" data-panel="upgrades">
        <div class="panel-head">
          <h2>升级</h2>
          <span id="upgrade-count" class="muted"></span>
        </div>
        <!-- 建筑自己的升级**不在这张列表里**：它们挂到各座建筑的 ⬆ 上（一条线只有一个家，
             与「永久」那条线不进这里同一条规矩）。这里必须**说出去**有多少条被移走了，
             否则就是静默少内容。文案由 app.js 的 renderUpgrades 填。 -->
        <p id="upgrade-hint" class="muted"></p>
        <div id="upgrades" class="list"></div>
      </div>

      <!-- 永久升级线：转生后保留的那条线（`upgrades[].isPermanent`），也是转生货币唯一的去处。
           它刻意**不服从 hiddenUntilUnlocked**（与「升级」面板相反）：这条线的存在本身要在
           第一次舍命之前就能看见——否则玩家不知道该攒什么，而"舍一命换转生货币、再拿它买永久升级"
           正是这个游戏的主循环。锁着的行照样列出来，带解锁条件与进度。 -->
      <div class="panel hidden" data-panel="permanent">
        <div class="panel-head">
          <h2>永久升级线</h2>
          <span id="permanent-count" class="muted"></span>
        </div>
        <p id="permanent-wallet" class="wallet"></p>
        <p id="permanent-hint" class="muted"></p>
        <div id="permanent" class="list"></div>
      </div>

      <div class="panel hidden" data-panel="codex">
        <div class="panel-head"><h2>图鉴</h2><span id="codex-count" class="muted"></span></div>
        <div id="codex" class="list"></div>
      </div>

      <div class="panel hidden" data-panel="achievements">
        <div class="panel-head"><h2>成就</h2><span class="muted" id="achievement-count"></span></div>
        <div id="achievement-list" class="list"></div>
      </div>

      <!-- 日志：GameSnapshot.notifications 的落点。买过什么、解锁了什么、金猫来过，
           还有存档失败这类警告——引擎一路推到这里，此前前端一处都没画过。 -->
      <div class="panel hidden" data-panel="log">
        <div class="panel-head"><h2>日志</h2><span class="muted" id="log-count"></span></div>
        <div id="log" class="list"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>
      这个页面不做任何游戏计算——数字、价格、能不能买得起、进度百分比，全是服务端在
      <code>GameSnapshot</code> 里算好后推过来的。关掉页面游戏照常在跑，
      回来时还会结算离线收益。
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
